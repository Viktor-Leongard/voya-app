<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voya — Make the most of every day off</title>
  <style>
    :root { --green:#3DA35D; --ink:#14281A; --sub:#50695A; --bg:#F6FAF7; --bg2:#D2EAD8; --line:#DCE9E0; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink);
      background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%); min-height:100vh;
      font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:680px; margin:0 auto; padding:72px 22px 60px; }
    .mark { color:var(--green); font-weight:700; font-size:26px; letter-spacing:-0.5px; }
    h1 { font-size:40px; line-height:1.1; letter-spacing:-1.2px; margin:22px 0 10px; }
    .lead { font-size:18px; color:#243B2C; max-width:34ch; }
    .links { margin-top:34px; display:flex; gap:14px; flex-wrap:wrap; }
    .btn { display:inline-block; background:#fff; border:1px solid var(--line); border-radius:12px;
      padding:12px 20px; text-decoration:none; color:var(--ink); font-weight:600; }
    .btn.primary { background:var(--green); color:#fff; border-color:var(--green); }
    footer { margin-top:64px; }
    .muted { color:var(--sub); font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark">Voya</span>
    <h1>Make the most of every day off.</h1>
    <p class="lead">See your whole year at a glance, find clever bridge days, and turn a few vacation days into long breaks.</p>
    <div class="links">
      <a class="btn primary" href="support.html">Support</a>
      <a class="btn" href="privacy.html">Privacy Policy</a>
    </div>
    <footer>
      <p class="muted">© 2026 Viktor Leongard. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
